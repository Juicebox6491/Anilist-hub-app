name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure WWW Directory and Index File
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          fi
          if [ ! -f www/index.html ]; then
            echo "<html><body><h1>AniList Hub</h1></body></html>" > www/index.html
          fi

      - name: Install Capacitor Dependencies
        run: npm install @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0

      - name: Initialize Capacitor
        run: npx cap init "AniList Hub" "com.anilisthub.app" --web-dir "www"

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniListHub-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
