name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Capacitor CLI & Core
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor Config
        run: |
          npx cap init "AniList Hub" com.anilisthub.app --web-dir www

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniListHub-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
