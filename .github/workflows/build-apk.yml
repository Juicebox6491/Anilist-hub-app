name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ensure WWW Directory and Index File
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          fi
          if [ ! -f www/index.html ]; then
            echo "<html><body><h1>AniList Hub</h1></body></html>" > www/index.html
          fi

      - name: Install Capacitor Dependencies
        run: npm install @capacitor/cli@^6.0.0 @capacitor/core@^6.0.0 @capacitor/android@^6.0.0

      - name: Initialize Capacitor
        run: npx cap init "AniList Hub" "com.anilisthub.app" --web-dir "www"

      - name: Add Android Platform
        run: npx cap add android

      - name: Sync Capacitor Assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK File
        run: mv android/app/build/outputs/apk/debug/app-debug.apk AniListHub.apk

      - name: Create Continuous GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AniList Hub - Latest Build
          body: "Automated APK build generated directly from latest commit."
          files: AniListHub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
